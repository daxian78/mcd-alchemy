function toggleCart() {
  if (!cartCount()) return;
  renderCartItems();
  document.getElementById("cartSheet").classList.add("open");
  document.getElementById("mask").classList.add("open");
}
function renderCartItems() {
  document.getElementById("cartItems").innerHTML = Object.keys(cart).map(function (k) {
    var it = cart[k];
    return '<div class="ci"><div class="n">' + it.name + (it.cfg ? '<small>' + it.cfg + '</small>' : '') + '</div>' +
      '<div class="qty"><b class="minus" onclick="chQty(\'' + k.replace(/"/g, "&quot;") + '\',-1)">−</b><span>' + it.qty + '</span><b onclick="chQty(\'' + k.replace(/"/g, "&quot;") + '\',1)">+</b></div>' +
      '<div style="font-size:13px;font-weight:700;min-width:52px;text-align:right;">¥' + (it.price * it.qty).toFixed(1) + '</div></div>';
  }).join("");
}
function closeSheets() {
  document.querySelectorAll(".sheet,.sheet-mask").forEach(function (e) { e.classList.remove("open"); });
}
/* ===== 套餐配置（真实结构） ===== */
function openCombo(code) {
  var it = findItem(code);
  if (!DETAIL[code]) {
    addItem(code, it.n, it.p, 1, "默认配置");
    closeSheets(); bump();
    return;
  }
  curCombo = code; curCfg = {};
  var d = DETAIL[code];
  d.rounds.forEach(function (r, ri) {
    if (r.choices) curCfg["r" + ri] = r.def;
    if (r.mods) r.mods.forEach(function (m, mi) { curCfg["m" + ri + mi] = m.def; });
  });
  renderCombo();
  document.getElementById("comboSheet").classList.add("open");
  document.getElementById("mask").classList.add("open");
}
function renderCombo() {
  var it = findItem(curCombo), d = DETAIL[curCombo];
  var extra = 0, lines = [];
  var h = '<h3>' + it.n + ' <span style="font-size:12px;color:#DA291C;">¥' + it.p.toFixed(1) + '（原 ' + it.o.toFixed(1) + '）</span></h3>';
  d.rounds.forEach(function (r, ri) {
    h += '<div class="round"><div class="rh">' + r.name + '</div>';
    if (r.choices) {
      h += '<div class="chips">';
      r.choices.forEach(function (c) {
        h += '<div class="chip' + (curCfg["r" + ri] === c[0] ? " on" : "") + '" onclick="setR(' + ri + ',\'' + c[0] + '\')">' + c[1] +
             (c[2] ? '<span class="dp"> ' + (c[2] > 0 ? "+" : "") + c[2] + ' 元</span>' : '') + '</div>';
        if (curCfg["r" + ri] === c[0]) { extra += c[2]; lines.push(c[1]); }
      });
      h += '</div>';
    }
    if (r.mods) {
      h += '<div class="chips">';
      r.mods.forEach(function (m, mi) {
        h += '<div class="chip' + (curCfg["m" + ri + mi] ? " on" : "") + '" onclick="setM(' + ri + ',' + mi + ')">' + m.k + '</div>';
        if (curCfg["m" + ri + mi]) lines.push(m.k);
      });
      h += '</div><div class="mod-h">默认全料，点击移除</div>';
    }
    h += '</div>';
  });
  h += '<div class="foot" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">' +
       '<span style="font-size:12px;color:#6B655F;">默认配置 +¥0 · 换选差价已计入</span>' +
       '<span class="go" onclick="addCombo()">加入购物车</span></div>';
  h += '<div class="sumbox" style="margin-top:10px;">配置：' + it.n.replace("四件套", "") + "（" + (lines.join(" + ") || "默认") + "）</div>";
  document.getElementById("comboBody").innerHTML = h;
  curCfg._extra = extra; curCfg._lines = lines.join(" + ");
}
function setR(ri, code) { curCfg["r" + ri] = code; renderCombo(); }
function setM(ri, mi) { curCfg["m" + ri + mi] = curCfg["m" + ri + mi] ? 0 : 1;
  var d = DETAIL[curCombo], on = 0;
  d.rounds[ri].mods.forEach(function (m, mi2) { if (curCfg["m" + ri + mi2]) on++; });
  if (on > 2) curCfg["m" + ri + mi] = 0;
  renderCombo();
}
function addCombo() {
  var it = findItem(curCombo);
  var price = Math.round((it.p + (curCfg._extra || 0)) * 10) / 10;
  addItem(curCombo, it.n, price, 1, curCfg._lines || "默认配置");
  closeSheets(); bump();
}
/* ===== 摘要 ===== */
function openSummary() {
  if (!cartCount()) return;
  var f = cartFood(), lines = Object.keys(cart).map(function (k) {
    return "· " + cart[k].name + (cart[k].cfg ? "（" + cart[k].cfg + "）" : "") + " ×" + cart[k].qty + " = ¥" + (cart[k].price * cart[k].qty).toFixed(1);
  });
  document.getElementById("sumBox").textContent =
    "配送地址：上海市浦东新区三林镇（金谊广场店配送）\n" + lines.join("\n") +
    "\n商品小计 ¥" + f.toFixed(1) + " + 配送 ¥6.0 + 打包 ¥1.9 = 合计 ¥" + (f + 7.9).toFixed(1) +
    "\n\n真实链路：roundList/modification → calculate-price 复价 → create-order → 支付链接（用户支付）";
  document.getElementById("summarySheet").classList.add("open");
  document.getElementById("mask").classList.add("open");
}
/* ===== init ===== */
renderNav(); renderList(); renderCart();
</script>
</body>
